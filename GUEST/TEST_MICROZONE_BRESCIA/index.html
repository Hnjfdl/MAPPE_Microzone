const COLORI=[
"#e6194b","#3cb44b","#4363d8","#f58231",
"#911eb4","#46f0f0","#f032e6","#bcf60c",
"#fabebe","#008080","#e6beff","#9a6324",
"#800000","#808000","#000075","#a9a9a9",
"#ffd8b1","#000000","#fffac8","#469990",
"#dcbeff","#ffe119","#aaffc3","#42d4f4"
];

const nomiQuartieri=[...new Set(
 M.map(x=>x.quartiere)
 .filter(x=>x&&x!=="Quartiere non identificato")
)].sort();

const coloriQuartieri={};

nomiQuartieri.forEach((nome,i)=>{
 coloriQuartieri[nome]=COLORI[i%COLORI.length];
});

L.tileLayer(
 "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
 {maxZoom:20,attribution:"&copy; OpenStreetMap contributors"}
).addTo(map);

const g=L.featureGroup().addTo(map);

M.forEach(x=>{
 const colore=
  x.quartiere==="Quartiere non identificato"?
  "#777":
  (coloriQuartieri[x.quartiere]||"#777");

 L.geoJSON(x.geojson,{
  style:{
   color:colore,
   weight:2,
   fillColor:colore,
   fillOpacity:.25
  }
 })
 .bindTooltip(
  ""+x.n,
  {permanent:true,direction:"center",className:"n"}
 )
 .bindPopup(
  "<b>Microzona "+x.n+"</b>"+
  "<br>Quartiere: <b>"+x.quartiere+"</b>"+
  "<br>Isolati aggregati: "+x.isolati+
  "<br>Area: "+x.area+" m²"+
  "<br>Target: 300 m"
 )
 .addTo(g);
});

/*
    Le barriere continuano ad essere utilizzate
    geometricamente ma NON vengono visualizzate.
*/

if(g.getLayers().length)
 map.fitBounds(g.getBounds(),{padding:[20,20]});

L.control.scale({metric:true,imperial:false}).addTo(map);
