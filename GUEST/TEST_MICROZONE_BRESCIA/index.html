const gruppo=L.featureGroup().addTo(map);


zone.forEach(q=>{

    const p=L.geoJSON(
        q.geojson,
        {
            style:{
                color:"#006cff",
                weight:2,
                fillOpacity:.12
            }
        }
    );

    p.bindTooltip(
        String(q.n),
        {
            permanent:true,
            direction:"center",
            className:"numero"
        }
    );

    p.bindPopup(
        "<b>Microzona - "+q.n+"</b><br>"+
        "Area: "+Math.round(q.area/1000)+" mila m²<br>"+
        "Edifici OSM: "+q.edifici
    );

    p.addTo(gruppo);
});


strade.forEach(x=>{

    L.geoJSON(
        x.geojson,
        {
            style:{
                color:"#777",
                weight:1,
                opacity:.30
            }
        }
    ).addTo(map);

});


barriere.forEach(x=>{

    L.geoJSON(
        x.geojson,
        {
            style:{
                color:"#d00000",
                weight:3,
                opacity:.8
            }
        }
    )
    .bindPopup(
        "Barriera: "+x.tipo
    )
    .addTo(map);

});


if(gruppo.getLayers().length)
    map.fitBounds(
        gruppo.getBounds(),
        {padding:[30,30]}
    );


L.control.scale({
    metric:true,
    imperial:false
}).addTo(map);

</script>
