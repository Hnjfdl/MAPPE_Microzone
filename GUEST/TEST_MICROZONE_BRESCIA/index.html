const C={};
Q.forEach((q,i)=>C[q]=COLORI[i%COLORI.length]);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{maxZoom:20,attribution:"© OpenStreetMap contributors"}).addTo(map);

const g=L.featureGroup().addTo(map);

I.forEach(x=>{
 const colore=C[x.quartiere]||"#777";

 L.geoJSON(x.geojson,{
  style:{color:colore,weight:3,fillColor:colore,fillOpacity:.22}
 })
 .bindTooltip(""+x.n,{permanent:true,direction:"center",className:"n"})
 .bindPopup(
  "<b>Microzona "+x.n+"</b>"+
  "<br>Quartiere: <b>"+x.quartiere+"</b>"+
  "<br>Isolati: "+x.isolati+
  "<br>Area: "+x.area+" m²"
 )
 .addTo(g);
});

if(g.getLayers().length)
 map.fitBounds(g.getBounds(),{padding:[20,20]});

L.control.scale({metric:true,imperial:false}).addTo(map);
</script></body></html>
