const gruppo =
    L.featureGroup()
        .addTo(map);


// AREA ORIGINALE
// bordo morbido

L.geoJSON(
    interesse,
    {
        style:{
            color:"#00a0ff",
            weight:2,
            dashArray:"8,6",
            fill:false,
            opacity:.8
        }
    }
)
.bindPopup(
    "Area richiesta - bordo morbido"
)
.addTo(map);


// STRADE DI RIFERIMENTO

strade.forEach(x => {

    L.geoJSON(
        x.geojson,
        {
            style:{
                color:"#777",
                weight:
                    x.tipo === "primary"
                        ? 2
                        : 1,

                opacity:.25
            }
        }
    ).addTo(map);

});


// BARRIERE FORTI

barriere.forEach(x => {

    L.geoJSON(
        x.geojson,
        {
            style:{
                color:"#d00000",
                weight:3,
                opacity:.85
            }
        }
    )
    .bindPopup(
        "Barriera: " +
        x.tipo
    )
    .addTo(map);

});


// MICROZONE

zone.forEach(q => {

    const p =
        L.geoJSON(
            q.geojson,
            {
                style:{
                    color:"#006cff",
                    weight:2,
                    fillColor:"#1685ff",
                    fillOpacity:.10
                }
            }
        );


    p.bindTooltip(
        String(q.n),
        {
            permanent:true,
            direction:"center",
            className:"numero"
        }
    );


    p.bindPopup(
        "<b>Microzona " +
        q.n +
        "</b><br>" +

        (
            q.quartiere
                ? "Quartiere: " +
                  q.quartiere +
                  "<br>"
                : ""
        ) +

        "Area: " +
        Math.round(
            q.area / 1000
        ) +
        " mila m²<br>" +

        "Edifici OSM: " +
        q.edifici +
        "<br>" +

        "Superficie edificata: " +
        Math.round(
            q.edificato / 1000
        ) +
        " mila m²<br>" +

        "Score geometrico: " +
        q.score
    );


    p.addTo(gruppo);

});


if (
    gruppo.getLayers().length
)
    map.fitBounds(
        gruppo.getBounds(),
        {
            padding:[25,25]
        }
    );


L.control.scale({
    metric:true,
    imperial:false
}).addTo(map);


// LEGENDA

const info =
    L.control({
        position:"topright"
    });


info.onAdd = function(){

    const div =
        L.DomUtil.create(
            "div",
            "info"
        );

    div.innerHTML =
        "<b>Microzone immobiliari</b><br>" +
        "AREA 3 ≈ 500 m<br>" +
        "Blu = microzone<br>" +
        "Rosso = barriere forti<br>" +
        "Tratteggio = area richiesta";

    return div;
};


info.addTo(map);

</script>
