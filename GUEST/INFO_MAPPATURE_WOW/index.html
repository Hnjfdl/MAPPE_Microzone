<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Microzone</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{height:100%;margin:0}
.numero{background:white;border:1px solid #555;box-shadow:none;font-weight:bold;padding:2px 5px}
</style>
</head>

<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map=L.map("map");

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"&copy; OpenStreetMap contributors"
    }
).addTo(map);

const quadrati=[{"n":1,"maxLat":45.541706,"minLat":45.537268,"minLon":10.198789,"maxLon":10.205269},{"n":2,"maxLat":45.541706,"minLat":45.537268,"minLon":10.205269,"maxLon":10.211749},{"n":3,"maxLat":45.541706,"minLat":45.537268,"minLon":10.211749,"maxLon":10.218229},{"n":4,"maxLat":45.541706,"minLat":45.537268,"minLon":10.218229,"maxLon":10.224708999999999},{"n":5,"maxLat":45.541706,"minLat":45.537268,"minLon":10.224708999999999,"maxLon":10.231188999999999},{"n":6,"maxLat":45.537268,"minLat":45.53283,"minLon":10.198789,"maxLon":10.205269},{"n":7,"maxLat":45.537268,"minLat":45.53283,"minLon":10.205269,"maxLon":10.211749},{"n":8,"maxLat":45.537268,"minLat":45.53283,"minLon":10.211749,"maxLon":10.218229},{"n":9,"maxLat":45.537268,"minLat":45.53283,"minLon":10.218229,"maxLon":10.224708999999999},{"n":10,"maxLat":45.537268,"minLat":45.53283,"minLon":10.224708999999999,"maxLon":10.231188999999999},{"n":11,"maxLat":45.53283,"minLat":45.528392,"minLon":10.198789,"maxLon":10.205269},{"n":12,"maxLat":45.53283,"minLat":45.528392,"minLon":10.205269,"maxLon":10.211749},{"n":13,"maxLat":45.53283,"minLat":45.528392,"minLon":10.211749,"maxLon":10.218229},{"n":14,"maxLat":45.53283,"minLat":45.528392,"minLon":10.218229,"maxLon":10.224708999999999},{"n":15,"maxLat":45.528392,"minLat":45.523953999999996,"minLon":10.211749,"maxLon":10.218229},{"n":16,"maxLat":45.528392,"minLat":45.523953999999996,"minLon":10.218229,"maxLon":10.224708999999999}];
const gruppo=L.featureGroup().addTo(map);

quadrati.forEach(q=>{

    const p=L.polygon([
        [q.maxLat,q.minLon],
        [q.maxLat,q.maxLon],
        [q.minLat,q.maxLon],
        [q.minLat,q.minLon]
    ],{
        color:"#006cff",
        weight:2,
        fillOpacity:.10
    });

    p.bindTooltip(
        String(q.n),
        {
            permanent:true,
            direction:"center",
            className:"numero"
        }
    );

    p.bindPopup("<b>Microzona - "+q.n+"</b>");
    p.addTo(gruppo);
});

map.fitBounds(gruppo.getBounds(),{padding:[30,30]});

L.control.scale({
    metric:true,
    imperial:false
}).addTo(map);

</script>
</body>
</html>
