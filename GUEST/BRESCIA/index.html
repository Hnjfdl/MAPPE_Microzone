<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRESCIA</title><style>html,body{margin:0;height:100%;font:16px Arial}#stato{padding:24px}iframe{display:block;border:0;width:100%;height:100%}</style></head><body><div id="stato">Caricamento mappa…</div><script>
(async()=>{const stato=document.getElementById("stato");try{
if(typeof DecompressionStream!=="function")throw new Error("Aggiorna il browser per aprire questa mappa.");
const files=["dati-0ea5525b3352d0fcbbdb003c-0.bin","dati-0ea5525b3352d0fcbbdb003c-1.bin","dati-0ea5525b3352d0fcbbdb003c-2.bin"],parti=[];
for(let i=0;i<files.length;i++){stato.textContent="Caricamento mappa "+(i+1)+"/"+files.length;const r=await fetch("./"+files[i]);if(!r.ok)throw new Error("Dati della mappa non disponibili (HTTP "+r.status+"). Riprova tra qualche minuto.");parti.push(await r.arrayBuffer());}
const stream=new Blob(parti).stream().pipeThrough(new DecompressionStream("gzip")),html=await new Response(stream).text();
const frame=document.createElement("iframe");frame.title="BRESCIA";frame.srcdoc=html;document.body.replaceChildren(frame);
}catch(e){stato.textContent="Impossibile aprire la mappa: "+e.message;}})();
</script></body></html>
